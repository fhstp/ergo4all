name: ergo4all
version: 1.145.3
description: "The Flutter app for the Ergo4All project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

resolution: workspace

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  auto_rula:
    git:
      url: https://github.com/fhstp/auto_rula.git
      ref: v1.1.1

  camera: ^0.10.0
  carousel_slider: ^5.1.1
  common: any
  common_ui: any
  cross_file: ^0.3.4+2
  csv: ^6.0.0
  custom_locale: any
  fast_immutable_collections: ^11.0.0
  fl_chart: ^0.70.2

  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.0.17
  fpdart: ^1.1.1
  image: ^4.5.4
  intl: any
  package_info_plus: ^8.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  pose_detect: any
  pose_vis: any
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  svg_flutter: ^0.0.1
  tflite_flutter: ^0.12.1
  toggle_switch: ^2.3.0
  url_launcher: ^6.3.0
  wakelock_plus: ^1.3.3

dev_dependencies:
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  very_good_analysis: ^8.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/puppet/
    - assets/images/puppet_scenario/
    - assets/images/puppets_good_bad/
    - assets/images/logos/
    - assets/har/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logos/IconRed.png"
